# Packages live in two sibling tables: [packages] = Arch family
# (pacman/aur/aur_yay, canonical, never renamed) and [packages.fedora] =
# Fedora family (dnf/copr/rpmfusion/swap). A profile with no
# [packages.fedora] is skipped, with a printed reason, on Fedora.

name = "hardware-lianli"
description = "Lian Li chassis (fan/RGB/LCD) — built from AUR via yay"
visibility = "personal"

[packages]
pacman = []
aur = []
# `lianli-linux-git` only builds cleanly under yay (paru's review pipeline
# trips on its post-install hooks). 8sync will bootstrap yay if absent even
# when paru is already present.
aur_yay = ["lianli-linux-git"]

# Fedora gets a real rpm from the maintainer's COPR, so none of the yay
# bootstrap above applies there.
[packages.fedora]
dnf = ["lian-li-linux"]
copr = ["sgtaziz/lian-li-linux"]

[requires]
aur_helper = true

[services]
system_enable = []
user_enable = []

[post_install]
commands = []
hint = "Launch Lian-Li-Linux from app menu. May need to re-plug controller USB and reboot once."
